<main class="login-box">
  <div class="login-logo">
    <a routerLink="/dashboard/v1" class="text-decoration-none"><b>Admin</b>LTE</a>
  </div>
  <!-- /.login-logo -->
  <div class="card shadow-sm">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      <form (submit)="login($event)">
        <label class="visually-hidden" for="loginEmail">Email</label>
        <div class="input-group mb-3">
          <input
            id="loginEmail"
            type="email"
            class="form-control"
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required
          />
          <div class="input-group-text">
            <span class="bi bi-envelope"></span>
          </div>
        </div>
        <label class="visually-hidden" for="loginPassword">Password</label>
        <div class="input-group mb-3">
          <input
            id="loginPassword"
            type="password"
            class="form-control"
            placeholder="Password"
            [(ngModel)]="password"
            name="password"
            required
          />
          <div class="input-group-text">
            <span class="bi bi-lock-fill"></span>
          </div>
        </div>
        <!--begin::Row-->
        <div class="row">
          <div class="col-8">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="flexCheckDefault"
                [(ngModel)]="rememberMe"
                name="rememberMe"
              />
              <label class="form-check-label" for="flexCheckDefault"> Remember Me </label>
            </div>
          </div>
          <!-- /.col -->
          <div class="col-4">
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Sign In</button>
            </div>
          </div>
          <!-- /.col -->
        </div>
        <!--end::Row-->
      </form>

      <div class="social-auth-links text-center mb-3 d-grid gap-2">
        <p>- OR -</p>
        <a href="#" class="btn btn-primary" (click)="$event.preventDefault()">
          <i class="bi bi-facebook me-2"></i> Sign in using Facebook
        </a>
        <a href="#" class="btn btn-danger" (click)="$event.preventDefault()">
          <i class="bi bi-google me-2"></i> Sign in using Google
        </a>
      </div>
      <!-- /.social-auth-links -->

      <p class="mb-1">
        <a routerLink="/auth/forgot-password" class="text-decoration-none">I forgot my password</a>
      </p>
      <p class="mb-0">
        <a routerLink="/auth/register" class="text-decoration-none"> Register a new membership </a>
      </p>
    </div>
    <!-- /.login-card-body -->
  </div>
</main>

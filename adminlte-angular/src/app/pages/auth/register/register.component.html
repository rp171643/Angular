<main class="register-box">
  <div class="register-logo">
    <a routerLink="/dashboard/v1" class="text-decoration-none"><b>Admin</b>LTE</a>
  </div>
  <!-- /.register-logo -->
  <div class="card shadow-sm">
    <div class="card-body register-card-body">
      <p class="register-box-msg">Register a new membership</p>

      <form (submit)="register($event)">
        <label class="visually-hidden" for="registerName">Full Name</label>
        <div class="input-group mb-3">
          <input
            id="registerName"
            type="text"
            class="form-control"
            placeholder="Full Name"
            [(ngModel)]="fullName"
            name="fullName"
            required
          />
          <div class="input-group-text">
            <span class="bi bi-person"></span>
          </div>
        </div>
        <label class="visually-hidden" for="registerEmail">Email</label>
        <div class="input-group mb-3">
          <input
            id="registerEmail"
            type="email"
            class="form-control"
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required
          />
          <div class="input-group-text">
            <span class="bi bi-envelope"></span>
          </div>
        </div>
        <label class="visually-hidden" for="registerPassword">Password</label>
        <div class="input-group mb-3">
          <input
            id="registerPassword"
            type="password"
            class="form-control"
            placeholder="Password"
            [(ngModel)]="password"
            name="password"
            required
          />
          <div class="input-group-text">
            <span class="bi bi-lock-fill"></span>
          </div>
        </div>
        <!--begin::Row-->
        <div class="row">
          <div class="col-8">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="agreeTerms"
                [(ngModel)]="agreeTerms"
                name="agreeTerms"
              />
              <label class="form-check-label" for="agreeTerms">
                I agree to the <a href="#" (click)="$event.preventDefault()">terms</a>
              </label>
            </div>
          </div>
          <!-- /.col -->
          <div class="col-4">
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Register</button>
            </div>
          </div>
          <!-- /.col -->
        </div>
        <!--end::Row-->
      </form>

      <div class="social-auth-links text-center mb-3 d-grid gap-2">
        <p>- OR -</p>
        <a href="#" class="btn btn-primary" (click)="$event.preventDefault()">
          <i class="bi bi-facebook me-2"></i> Sign up using Facebook
        </a>
        <a href="#" class="btn btn-danger" (click)="$event.preventDefault()">
          <i class="bi bi-google me-2"></i> Sign up using Google
        </a>
      </div>
      <!-- /.social-auth-links -->

      <p class="mb-0 text-center">
        <a routerLink="/auth/login" class="text-decoration-none"> I already have a membership </a>
      </p>
    </div>
    <!-- /.register-card-body -->
  </div>
</main>
